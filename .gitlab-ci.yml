stages:
  - build
  - test

variables:
  NODE_VERSION: "24"
  PNPM_VERSION: "9"
  DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
  NEXTAUTH_URL: "https://placeholder.example.com"
  NEXTAUTH_SECRET: "placeholder-secret-for-ci-build-only"
  ZITADEL_ISSUER: "https://placeholder.zitadel.cloud"
  ZITADEL_CLIENT_ID: "placeholder"
  ZITADEL_CLIENT_SECRET: "placeholder"
  ZITADEL_PAT: "placeholder"
  ORGANIZATION_ID: "00000000-0000-0000-0000-000000000000"

default:
  image: node:24-slim
  before_script:
    - npm install -g pnpm@9
    - pnpm install --frozen-lockfile

build:
  stage: build
  script:
    - pnpm --filter=@coalita/db build
    - pnpm --filter=@coalita/ui build
    - pnpm --filter=web build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .pnpm-store/

test:
  stage: test
  script:
    - pnpm typecheck --filter=web || true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .pnpm-store/
